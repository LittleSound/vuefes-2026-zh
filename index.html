<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vue Fes 2026">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<title>Vue Fes Japan 2026 · 中文日程</title>
<style>
:root {
  --bg: #f4f6f5;
  --card: #ffffff;
  --text: #17201c;
  --sub: #5d6964;
  --faint: #8c9792;
  --line: #e2e7e4;
  --accent: #2f9e6e;
  --accent-soft: #e3f4ec;
  --warn: #c2410c;
  --warn-soft: #fff1e8;
  --t1: #e0567a;
  --t2: #2f9e6e;
  --t3: #2f7ae0;
  --t4: #d18a12;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1210;
    --card: #181e1b;
    --text: #e8eeeb;
    --sub: #a3aea9;
    --faint: #6f7a75;
    --line: #27302c;
    --accent: #4cc38a;
    --accent-soft: #1b3328;
    --warn: #fb923c;
    --warn-soft: #3a2316;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", sans-serif;
  padding-bottom: calc(96px + var(--safe-b));
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
a { color: var(--accent); }

header.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  backdrop-filter: saturate(180%) blur(16px);
  padding: calc(8px + var(--safe-t)) 12px 8px;
  border-bottom: .5px solid var(--line);
  transition: transform .25s ease;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; white-space: nowrap; line-height: 1.2; }
.brand h1 span { color: var(--accent); }
.brand h1 small { display: block; color: var(--sub); font-size: 11px; font-weight: 400; }

.seg {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr;
  background: var(--line); border-radius: 9px; padding: 2px;
}
.seg button { padding: 6px 0; border-radius: 7px; font-size: 13.5px; font-weight: 600; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.chips { display: flex; gap: 6px; overflow-x: auto; margin: 8px -12px 0; padding: 0 12px 1px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; padding: 4px 10px; border-radius: 99px;
  background: var(--card); border: 1px solid var(--line); color: var(--sub);
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); color: var(--text); background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--card)); }

main { padding: 4px 12px 0; max-width: 760px; margin: 0 auto; }
.note { font-size: 12.5px; color: var(--sub); margin: 12px 4px; }

.slot { margin-top: 14px; }
.slot-head {
  position: sticky; top: var(--head-h, 150px); z-index: 5;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 4px; background: var(--bg);
  font-weight: 700; font-variant-numeric: tabular-nums;
  transition: top .25s ease;
}
.slot-head .now-pill { font-size: 11px; font-weight: 700; color: #fff; background: #e5484d; border-radius: 99px; padding: 1px 7px; }
.slot-head .rest { color: var(--faint); font-weight: 400; font-size: 13px; }

.card {
  position: relative; display: flex; gap: 0;
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
  margin: 8px 0; overflow: hidden;
  border: 1px solid transparent;
}
.card::before { content: ""; width: 4px; flex: none; background: var(--c, var(--faint)); }
.card.picked { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.card.cancel { opacity: .55; }
.card.cancel .title { text-decoration: line-through; }
.card.info { background: transparent; box-shadow: none; border: 1px dashed var(--line); }
.card .body { flex: 1; min-width: 0; padding: 11px 4px 11px 12px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--line); color: var(--sub); }
.tag.track { background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); font-weight: 600; }
.tag.live { background: #e5484d; color: #fff; }
.tag.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.title { font-size: 16px; font-weight: 650; line-height: 1.38; margin: 4px 0 2px; }
.orig { font-size: 12px; color: var(--faint); line-height: 1.4; }
.who { font-size: 13.5px; color: var(--sub); margin-top: 5px; }
.who b { color: var(--text); font-weight: 600; }
.more { display: none; margin-top: 8px; font-size: 14px; line-height: 1.65; }
.card.open .more { display: block; }
.more p { margin: 0 0 8px; }
.more ul { margin: 0 0 8px; padding-left: 18px; color: var(--sub); font-size: 13px; }
.more .extra { font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 6px 9px; border-radius: 8px; }
.toggle-more { font-size: 12.5px; color: var(--accent); margin-top: 6px; padding: 4px 0; }
.star {
  flex: none; width: 52px; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px;
  color: var(--faint);
}
.star svg { width: 28px; height: 28px; transition: transform .15s; }
.star[aria-pressed="true"] { color: var(--accent); }
.star[aria-pressed="true"] svg { transform: scale(1.08); }
.star:active svg { transform: scale(.85); }

.gap { margin: 10px 4px; padding: 8px 12px; border-radius: 10px; font-size: 13px; color: var(--faint); border: 1px dashed var(--line); }
.empty { text-align: center; color: var(--sub); padding: 48px 16px; line-height: 1.8; }

.extras { margin: 28px 4px 0; font-size: 13.5px; color: var(--sub); }
.extras h3 { font-size: 14px; color: var(--text); margin: 0 0 6px; }
.extras li { margin-bottom: 4px; }
footer { margin: 24px 4px 0; font-size: 12px; color: var(--faint); }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 7px 12px calc(7px + var(--safe-b));
  background: color-mix(in srgb, var(--card) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  backdrop-filter: saturate(180%) blur(16px);
  border-top: .5px solid var(--line);
  display: flex; gap: 8px; align-items: center;
  transition: transform .25s ease;
}
.bar .count { flex: 1; font-size: 13px; color: var(--sub); line-height: 1.3; min-width: 0; }
.bar .count b { color: var(--text); font-size: 17px; }
.bar .count .cf { color: var(--warn); }
.btn { padding: 8px 11px; border-radius: 11px; font-size: 14px; font-weight: 600; background: var(--line); white-space: nowrap; }
.btn.primary { background: var(--accent); color: #fff; }
.btn:disabled { opacity: .4; }

.fab {
  position: fixed; right: 14px; bottom: calc(76px + var(--safe-b)); z-index: 25;
  background: #e5484d; color: #fff; font-size: 13px; font-weight: 700;
  padding: 8px 13px; border-radius: 99px; box-shadow: 0 4px 14px rgba(229,72,77,.35);
  transition: transform .25s ease;
}
body.chrome-off header.top { transform: translateY(-100%); }
body.chrome-off .slot-head { top: 0; padding-top: calc(6px + var(--safe-t)); }
body.chrome-off .bar { transform: translateY(100%); }
body.chrome-off .fab { transform: translateY(calc(56px + var(--safe-b))); }

/*
 * Timetable grid (time × track). Column sizes come from fitGrid() in JS: when every track fits,
 * columns share the width and column heads stick to the top; otherwise the grid scrolls sideways
 * with the time column pinned and a sliver of the next column peeking in.
 */
main.wide { max-width: 1400px; }
.grid {
  display: grid; column-gap: var(--gap, 10px);
  grid-template-columns: var(--tcol, 52px) repeat(var(--cols), var(--colw, minmax(0, 1fr)));
}
.grid .colhead {
  position: sticky; top: var(--head-h); z-index: 6; background: var(--bg);
  font-size: 13px; font-weight: 700; padding: 10px 6px 6px; border-bottom: 3px solid var(--c);
  transition: top .25s ease;
}
body.chrome-off .grid .colhead { top: 0; }
.grid .tl {
  grid-column: 1; margin: 0; font-size: 13px; font-weight: 700; color: var(--sub);
  padding-top: 10px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.grid .tl.live { color: #e5484d; }
.grid .cell { display: flex; flex-direction: column; gap: 6px; padding: 5px 0; min-width: 0; }
.grid .cell .card { margin: 0; }
.grid .cell.single .card { flex: 1; }
.grid .cell .group-head { font-size: 12px; font-weight: 700; color: var(--sub); padding: 2px 4px; }
.grid .title { font-size: 15px; }
.grid .star { width: 44px; }
.grid .star svg { width: 24px; height: 24px; }

.grid.compact .orig { display: none; }
.grid.compact .tl { font-size: 12px; }
.grid.compact .title { font-size: 14.5px; }
.grid.compact .card .body { padding: 9px 2px 9px 10px; }
.grid.compact .star { width: 40px; padding-top: 8px; }

.grid-scroll.scrolls {
  overflow-x: auto; margin: 0 calc(-1 * var(--main-pad)); padding-right: var(--main-pad);
  scroll-snap-type: x mandatory; scroll-padding-left: calc(var(--tcol) + var(--gap));
  overscroll-behavior-x: contain;
}
.grid-scroll.scrolls .grid { width: max-content; }
.grid-scroll.scrolls .colhead { position: static; scroll-snap-align: start; }
.grid-scroll.scrolls .colhead:first-child,
.grid-scroll.scrolls .tl {
  position: sticky; left: 0; z-index: 4; background: var(--bg);
  padding-left: var(--main-pad); box-shadow: var(--gap) 0 0 var(--bg);
}

.layout-btn {
  flex: none; width: 34px; height: 32px; border-radius: 9px; background: var(--line); color: var(--sub);
  display: inline-flex; align-items: center; justify-content: center;
}
.layout-btn svg { width: 18px; height: 18px; }
.layout-btn[hidden] { display: none; }

main { --main-pad: 12px; }
@media (min-width: 900px) {
  main.wide { --main-pad: 20px; padding: 4px 20px 0; }
  .seg { flex: 0 1 360px; margin-left: auto; }
}
.toast {
  position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); z-index: 50;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: rgba(20,24,22,.92); color: #fff; font-size: 14px; padding: 9px 16px; border-radius: 99px;
  transition: .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

dialog {
  border: 0; border-radius: 16px; padding: 0; width: min(92vw, 560px);
  background: var(--card); color: var(--text);
}
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .dhead { padding: 14px 16px 6px; font-weight: 700; }
dialog .dhint { padding: 0 16px; font-size: 13px; color: var(--sub); }
dialog textarea {
  display: block; width: calc(100% - 32px); margin: 10px 16px; height: 46vh;
  /* 16px is the floor below which iOS Safari zooms the whole page on focus. */
  font: 16px/1.5 ui-monospace, Menlo, monospace; color: var(--text);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
}
dialog .dact { display: flex; gap: 8px; justify-content: flex-end; padding: 0 16px 14px; }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand">
    <h1>Vue Fes <span>2026</span><small>10/24（六）大手町</small></h1>
    <div class="seg" role="group">
      <button id="viewAll" aria-pressed="true">全部日程</button>
      <button id="viewMine" aria-pressed="false">我的日程</button>
    </div>
    <button class="layout-btn" id="layoutBtn" aria-label="切换时间表视图"></button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="list"></main>

<button class="fab" id="nowBtn" hidden>● 跳到现在</button>

<div class="bar">
  <div class="count" id="count"></div>
  <button class="btn" id="importBtn">导入</button>
  <button class="btn" id="copyList">复制清单</button>
  <button class="btn primary" id="copyPlan">复制全天计划</button>
</div>

<div class="toast" id="toast"></div>

<dialog id="imp">
  <div class="dhead">导入日程</div>
  <div class="dhint">粘贴从另一台设备「复制清单」或「复制全天计划」得到的文本。</div>
  <textarea id="impText" placeholder="在这里粘贴…"></textarea>
  <div class="dact">
    <button class="btn" id="impCancel">取消</button>
    <button class="btn" id="impMerge">合并</button>
    <button class="btn primary" id="impReplace">替换</button>
  </div>
</dialog>

<dialog id="dlg">
  <div class="dhead">复制文本</div>
  <div class="dhint">自动复制失败了，请长按下方文本 → 全选 → 拷贝。</div>
  <textarea id="dlgText" readonly></textarea>
  <div class="dact">
    <button class="btn" id="dlgShare" hidden>分享…</button>
    <button class="btn primary" id="dlgClose">完成</button>
  </div>
</dialog>

<script>
/**
 * Vue Fes Japan 2026 schedule (Chinese edition).
 * Source: https://vuefes.jp/2026/timetable (fetched 2026-10-24, JST).
 * Titles and summaries are translated / condensed from the official Japanese text.
 */
const OFFICIAL = 'https://vuefes.jp/2026'
const DATE = '2026-10-24'

const TRACKS = {
  t1: { name: 'hacomono', full: 'ウェルネス×hacomono トラック', color: 'var(--t1)' },
  t2: { name: 'Vue', full: 'Vue トラック', color: 'var(--t2)' },
  t3: { name: 'サイボウズ', full: 'サイボウズ トラック', color: 'var(--t3)' },
  t4: { name: 'メドピア', full: 'メドピア トラック', color: 'var(--t4)' },
}

const KIND = {
  keynote: '主题演讲', session: '演讲', sponsor: '白金赞助演讲', student: '学生支援赞助演讲',
  lunch: '午餐赞助 LT', panel: '圆桌讨论', lt: '闪电演讲 LT', handson: '动手实践', event: '活动', info: '日程',
}

/** `group` marks talks that run back-to-back in one block, so they never count as conflicts with each other. */
const S = [
  { id: 'reception', start: '09:00', end: '10:00', tracks: ['t1', 't2', 't3', 't4'], kind: 'info', title: '开场・签到', ja: '開場・受付' },
  { id: 'opening', start: '10:00', end: '10:10', tracks: ['t1', 't2'], kind: 'event', title: '开幕式', ja: 'オープニング' },
  { id: 'keynote', start: '10:10', end: '10:50', tracks: ['t1', 't2'], kind: 'keynote', title: '主题演讲', ja: 'キーノート',
    speakers: [['Evan You', 'VoidZero', 'CEO']],
    summary: 'Vue.js 与 Vite 的作者、VoidZero CEO Evan You 的年度主题演讲。' },

  { id: 'platinum-sponsor-session-1', start: '10:55', end: '11:05', tracks: ['t1'], kind: 'sponsor',
    title: '开发「设计」：用 Vue 改进设计流程', ja: 'デザインを開発する ~ Vueで実現するデザインプロセス改善 ~',
    speakers: [['竹井啓', '株式会社リンクアンドモチベーション', '设计工程师']], url: '/speaker/keeeeeei200',
    summary: '生成式 AI 让设计师写代码、工程师参与设计成为常态，但各角色之间"翻译"成果的环节仍然存在。介绍设计师与开发者在同一产出物上协作的原型方法：用线上真实运行的组件搭原型减少翻译损耗，记录决策经过以扩大可交给 AI 的范围。分享 AI × Vue.js 做设计工程的实践。' },
  { id: 'platinum-sponsor-session-2', start: '10:55', end: '11:05', tracks: ['t2'], kind: 'sponsor', title: '待定（TBD）', ja: 'TBD' },
  { id: 'platinum-sponsor-session-3', start: '11:05', end: '11:15', tracks: ['t1'], kind: 'sponsor',
    title: '用「契约」守护复合型产品的设计系统', ja: '契約で守るコンパウンドプロダクトのデザインシステム',
    speakers: [['山口 祐司', 'Dress Code株式会社', '产品工程师']], url: '/speaker/yug1224',
    summary: '横跨多个领域的复合型产品里，即使组件统一，token 用法和组件职责也会逐渐走样；文档规约 + Review 跟不上代码增长。他们把设计系统本体做成基于 Schema 的契约，用 Schema Driven UI 让同一 Schema 还原出同样的前端：非 token 值由类型检查拦截，跨层依赖由依赖检查拦截，人工评审只留给机器判断不了的部分。' },
  { id: 'platinum-sponsor-session-4', start: '11:05', end: '11:15', tracks: ['t2'], kind: 'sponsor',
    title: '不停机把 CloudSign 迁到 Nuxt：为下一个十年先定下的事', ja: 'クラウドサインを止めずに Nuxt へ、次の10年のために先に決めたこと',
    speakers: [['篠田貴大', '弁護士ドットコム株式会社', '前端工程师']], url: '/speaker/tttttt_621_s',
    summary: 'CloudSign 是 2015 年上线的电子合同云服务，运行十余年不能停。团队正以页面为单位从 Revel Template 迁移到 Nuxt：约 150 个页面、跨年项目，与 AI 一起推进。先把团队成功指标定为"功能开发交付周期"，再由此推导出新旧切换机制和迁移状态比对检查。分享判断标准与路线。' },
  { id: 'platinum-sponsor-session-5', start: '11:15', end: '11:25', tracks: ['t1'], kind: 'sponsor',
    title: 'Astro 就是新的 WordPress', ja: 'Astro is the new WordPress',
    speakers: [['Matt Kane', 'Cloudflare', '高级首席工程师']], url: '/speaker/ascorbic',
    summary: '如果 WordPress 在 2026 年从零设计会是什么样？它支撑着 43% 的 Web，但 20 年前的架构让插件可以无限制访问数据和基础设施，部署方式也已过时。EmDash 基于 Astro 与 Vite 从根本上重建这一模型：内容优先架构 + 灵活托管 + 沙箱化插件 + 同时面向人类编辑与 AI Agent 的工作流。' },
  { id: 'platinum-sponsor-session-6', start: '11:15', end: '11:25', tracks: ['t2'], kind: 'sponsor',

  { id: 'lunch', start: '11:25', end: '12:50', tracks: ['t1', 't2'], kind: 'info', title: '午餐时间', ja: 'ランチタイム',
    summary: '会场只在「午餐赞助 LT」提供限量免费午餐（先到先得），其余需自行解决；周边餐厅预计拥挤，留好时间。' },
  { id: 'student-support-sponsor-session-1', start: '11:30', end: '12:00', tracks: ['t4'], kind: 'student', group: 'student',
    title: '从应届生上手成本出发，决定迁移到 Nuxt 3', ja: '新卒のキャッチアップコストから決めたNuxt 3移行',

const STORE_KEY = 'vuefes2026:zh'
const state = Object.assign(
  { picks: [], view: 'all', track: 'all', open: [] },
  JSON.parse(localStorage.getItem(STORE_KEY) || '{}'),
)
const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(state))

const min = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m }
const byId = Object.fromEntries(S.map(s => [s.id, s]))
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const trackLabel = s => s.tracks.length === 4 ? '全场' : s.tracks.map(t => TRACKS[t].name).join(' / ')
const pickable = s => !s.cancelled && s.title !== '待定（TBD）'

/** Current minutes-of-day in JST, or null when today is not the event day. */
function nowJst() {
  const d = new Date(Date.now() + 9 * 3600e3)
  if (d.toISOString().slice(0, 10) !== DATE) return null
  return d.getUTCHours() * 60 + d.getUTCMinutes()
}
const isLive = (s, now) => now != null && min(s.start) <= now && now < min(s.end)

/** Returns ids of picked items that overlap another picked item, ignoring talks in the same back-to-back group. */
function conflicts() {
  const picked = state.picks.map(id => byId[id]).filter(Boolean)
  const bad = new Set()
  for (const a of picked) {
    for (const b of picked) {
      if (a === b || (a.group && a.group === b.group)) continue
      if (min(a.start) < min(b.end) && min(b.start) < min(a.end)) bad.add(a.id)
    }
  }
  return bad
}

function sorted(list) {
  return [...list].sort((a, b) => min(a.start) - min(b.start) || (a.order ?? 0) - (b.order ?? 0) || a.tracks[0].localeCompare(b.tracks[0]) || min(a.end) - min(b.end))
}

function cardHtml(s, now, bad) {
  const c = TRACKS[s.tracks[0]].color
  const picked = state.picks.includes(s.id)
  const open = state.open.includes(s.id)
  const people = (s.speakers || []).map(p => `<b>${esc(p[0])}</b>`).join('、')
  const host = (s.facilitators || []).map(p => `<b>${esc(p[0])}</b>`).join('、')
  const hasMore = s.summary || s.speakers || s.extra
  const cls = ['card', picked && 'picked', open && 'open', s.cancelled && 'cancel', s.kind === 'info' && 'info'].filter(Boolean).join(' ')
  return `<article class="${cls}" style="--c:${s.tracks.length > 2 ? 'var(--faint)' : c}" data-id="${s.id}">
    <div class="body" data-act="more">
      <div class="meta">
        <span>${s.start}–${s.end}</span>
        <span class="tag track" style="--c:${s.tracks.length > 2 ? 'var(--sub)' : c}">${esc(trackLabel(s))}</span>
        <span class="tag">${KIND[s.kind]}${s.order ? ` #${s.order}` : ''}</span>
        ${isLive(s, now) ? '<span class="tag live">进行中</span>' : ''}
        ${bad.has(s.id) ? '<span class="tag warn">时间冲突</span>' : ''}
      </div>
      <div class="title">${esc(s.title)}</div>
      ${s.ja && s.ja !== s.title ? `<div class="orig">${esc(s.ja)}</div>` : ''}
      ${people ? `<div class="who">${people}${host ? `　主持 ${host}` : ''}</div>` : ''}
      ${hasMore ? `<div class="more">
        ${s.summary ? `<p>${esc(s.summary)}</p>` : ''}
        ${s.list ? `<ul>${s.list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${s.speakers ? `<ul>${[...s.speakers, ...(s.facilitators || []).map(f => [f[0] + '（主持）', f[1], f[2]])].map(p => `<li>${esc(p[0])} · ${esc([p[1], p[2]].filter(Boolean).join(' / '))}</li>`).join('')}</ul>` : ''}
        ${s.extra ? `<p class="extra">${esc(s.extra)}</p>` : ''}
        ${s.url ? `<p><a href="${OFFICIAL}${s.url}" target="_blank" rel="noopener">官网原文 ↗</a></p>` : ''}
      </div>
      <button class="toggle-more">${open ? '收起 ▴' : '简介 ▾'}</button>` : ''}
    </div>
    ${pickable(s) ? `<button class="star" data-act="pick" aria-pressed="${picked}" aria-label="想去">
      <svg viewBox="0 0 24 24" fill="${picked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>
    </button>` : ''}
  </article>`
}

function render() {
  const now = nowJst()
  const bad = conflicts()
  const el = document.getElementById('list')
  document.getElementById('viewAll').setAttribute('aria-pressed', state.view === 'all')
  document.getElementById('viewMine').setAttribute('aria-pressed', state.view === 'mine')
  document.getElementById('viewMine').textContent = `我的日程${state.picks.length ? `（${state.picks.length}）` : ''}`
  document.getElementById('chips').style.display = state.view === 'all' ? '' : 'none'

  let html = ''
  const grid = state.view === 'all' && useGrid()
  el.classList.toggle('wide', grid)
  const lb = document.getElementById('layoutBtn')
  lb.hidden = state.view !== 'all'
  lb.setAttribute('aria-pressed', grid)
  lb.innerHTML = grid ? ICON_LIST : ICON_GRID
  if (grid) {
    html += '<p class="note">点卡片看简介，点 ☆ 标记想去的场次（自动保存在本机）。时间均为日本时间 JST。</p>'
    html += gridHtml(now, bad) + extrasHtml()
  } else if (state.view === 'all') {
    const list = sorted(S.filter(s => state.track === 'all' || s.tracks.includes(state.track)))
    html += '<p class="note">点卡片看简介，点 ☆ 标记想去的场次（自动保存在本机）。时间均为日本时间 JST。</p>'
    const slots = new Map()
    for (const s of list) (slots.get(s.start) || slots.set(s.start, []).get(s.start)).push(s)
    for (const [start, items] of slots) {
      const live = items.some(s => isLive(s, now))
      html += `<section class="slot" data-start="${start}"><div class="slot-head">${start}${live ? '<span class="now-pill">NOW</span>' : ''}</div>${items.map(s => cardHtml(s, now, bad)).join('')}</section>`
    }
    html += extrasHtml()
  } else {
    const list = sorted(state.picks.map(id => byId[id]).filter(Boolean))
    if (!list.length) {
      html = '<div class="empty">还没有标记任何场次喵～<br>去「全部日程」点 ☆ 吧</div>'
    } else {
      if (bad.size) html += `<p class="note" style="color:var(--warn)">⚠️ 有 ${bad.size} 场时间重叠，标了「时间冲突」的需要取舍。</p>`
      let cursor = min('09:00')
      for (const s of list) {
        if (min(s.start) - cursor >= 15) html += `<div class="gap">${fmt(cursor)}–${s.start} · 空档 ${min(s.start) - cursor} 分钟（逛展位 / 休息）</div>`
        html += cardHtml(s, now, bad)
        cursor = Math.max(cursor, min(s.end))
      }
    }
  }
  const keepX = el.querySelector('.grid-scroll')?.scrollLeft ?? 0
  el.innerHTML = html
  fitGrid()
  const gs = el.querySelector('.grid-scroll')
  if (gs) gs.scrollLeft = keepX

  const nb = bad.size
  document.getElementById('count').innerHTML = `已选 <b>${state.picks.length}</b> 场${nb ? `<br><span class="cf">${nb} 场冲突</span>` : ''}`
  document.getElementById('copyList').disabled = !state.picks.length
  document.getElementById('copyPlan').disabled = !state.picks.length
  document.getElementById('nowBtn').hidden = !(state.view === 'all' && now != null && now >= min('09:00') && now < min('19:30'))
}

const desktop = matchMedia('(min-width: 900px)')
/** Explicit user choice wins; otherwise grid on desktop, list on phones. */
const useGrid = () => state.layout ? state.layout === 'grid' : desktop.matches
const ICON_GRID = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>'
const ICON_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>'

/**
 * Desktop timetable: one column per visible track, rows cut at every distinct start/end time
 * (auto height, so short sponsor slots stay readable). Items sharing time + tracks + group,
 * e.g. the LT block, are stacked inside one cell.
 */
function gridHtml(now, bad) {
  const cols = Object.keys(TRACKS).filter(t => state.track === 'all' || t === state.track)
  const list = sorted(S.filter(s => s.tracks.some(t => cols.includes(t))))
  const times = [...new Set(list.flatMap(s => [s.start, s.end]))].sort((a, b) => min(a) - min(b))
  const row = t => times.indexOf(t) + 2
  const cells = new Map()
  for (const s of list) {
    const key = [s.start, s.end, s.tracks.join(), s.group || s.id].join('|')
    ;(cells.get(key) || cells.set(key, []).get(key)).push(s)
  }
  let html = `<div class="grid-scroll"><div class="grid" style="--cols:${cols.length}"><div class="colhead" style="grid-column:1;border-color:transparent"></div>`
  html += cols.map((t, i) => `<div class="colhead" style="grid-column:${i + 2};--c:${TRACKS[t].color}">${esc(TRACKS[t].full)}</div>`).join('')
  const starts = new Set(list.map(s => s.start))
  for (const t of times.slice(0, -1)) {
    if (!starts.has(t)) continue
    const live = list.some(s => s.start === t && isLive(s, now))
    html += `<div class="tl slot${live ? ' live' : ''}" data-start="${t}" style="grid-row:${row(t)}">${t}</div>`
  }
  for (const items of cells.values()) {
    const s = items[0]
    const idx = s.tracks.map(t => cols.indexOf(t)).filter(i => i >= 0)
    const head = items.length > 1 ? `<div class="group-head">${KIND[s.kind]} · ${s.start}–${s.end}</div>` : ''
    html += `<div class="cell${items.length > 1 ? '' : ' single'}" style="grid-row:${row(s.start)}/${row(s.end)};grid-column:${Math.min(...idx) + 2}/${Math.max(...idx) + 3}">${head}${items.map(x => cardHtml(x, now, bad)).join('')}</div>`
  }
  return html + '</div></div>'
}

/**
 * Sizes timetable columns from the space actually available. Fits as many columns as the comfortable
 * minimum width allows; if that is every track, they share the width with no scrolling. Otherwise the
 * visible columns shrink just enough to reveal a peek of the next one, hinting at sideways scrolling.
 * Narrow columns also switch cards to a compact style.
 */
function fitGrid() {
  const scroller = document.querySelector('.grid-scroll')
  if (!scroller) return
  const grid = scroller.firstElementChild
  const cols = Number(grid.style.getPropertyValue('--cols'))
  const main = document.getElementById('list')
  const pad = parseFloat(getComputedStyle(main).paddingLeft)
  const avail = main.clientWidth - 2 * pad
  const phone = avail < 600
  const tcol = phone ? 46 : 52
  const gap = phone ? 8 : 10
  const minCol = phone ? 250 : 230
  const peek = phone ? 28 : 40
  const fit = Math.max(1, Math.floor((avail - tcol) / (minCol + gap)))
  const scrolls = fit < cols
  const colw = scrolls
    ? (avail + pad - tcol - peek - gap) / fit - gap
    : (avail - tcol) / cols - gap
  scroller.classList.toggle('scrolls', scrolls)
  grid.classList.toggle('compact', colw < 290)
  grid.style.setProperty('--tcol', `${tcol + (scrolls ? pad : 0)}px`)
  grid.style.setProperty('--gap', `${gap}px`)
  grid.style.setProperty('--colw', `${Math.floor(colw)}px`)
  scroller.style.setProperty('--tcol', `${tcol + (scrolls ? pad : 0)}px`)
  scroller.style.setProperty('--gap', `${gap}px`)
}

function extrasHtml() {
  return `<div class="extras">
    <h3>会场其他活动</h3>
    <ul>
      <li><b>赞助商展位集章</b>（1F）：集满 10 枚贴纸可抽奖，最多 2 次，必中。</li>
      <li><b>万事咨询板</b>（2F 休息・充电区）：把问题写在便利贴上，现场的人会帮你解答。</li>
      <li><b>御守角</b>（1F）：第 8 届纪念，可做一个写着心愿的原创御守带走。</li>
      <li><b>免费饮料 & 零食</b>（1F・2F 门厅）。</li>
    </ul>
  </div>
  <footer>数据来源：<a href="${OFFICIAL}/timetable" target="_blank" rel="noopener">vuefes.jp/2026/timetable</a>（2026-10-24 抓取，中文为翻译整理）。闪电演讲 #1–#10 依次在 16:35–17:50 进行，具体顺序以现场为准。</footer>`
}

const fmt = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`

function speakerLine(s) {
  const sp = (s.speakers || []).map(p => p[0] + (p[1] ? `（${p[1]}）` : '')).join('、')
  const fa = (s.facilitators || []).map(p => p[0]).join('、')
  return [sp, fa && `主持：${fa}`].filter(Boolean).join('；')
}

/** Detailed checklist of picked items, meant for notes or sharing with friends. */
function exportList() {
  const bad = conflicts()
  const list = sorted(state.picks.map(id => byId[id]).filter(Boolean))
  const lines = [`⭐ Vue Fes Japan 2026 · 我想去的场次（${list.length}）`, '2026/10/24（六）大手町 Place Hall & Conference', '']
  list.forEach((s, i) => {
    lines.push(`${i + 1}. ${s.start}–${s.end}［${trackLabel(s)}］${s.title}${bad.has(s.id) ? ' ⚠️冲突' : ''}`)
    if (s.ja && s.ja !== s.title) lines.push(`   ${s.ja}`)
    const who = speakerLine(s)
    if (who) lines.push(`   🎤 ${who}`)
    if (s.url) lines.push(`   🔗 ${OFFICIAL}${s.url}`)
    lines.push('')
  })
  lines.push(importCode())
  return lines.join('\n')
}

/** Whole-day timeline: picked items plus explicit free gaps, from doors-open to the last pick. */
function exportPlan() {
  const bad = conflicts()
  const list = sorted(state.picks.map(id => byId[id]).filter(Boolean))
  const lines = ['📅 Vue Fes Japan 2026 · 我的全天计划', '2026/10/24（六）大手町 Place Hall & Conference', '']
  let cursor = min('09:00')
  for (const s of list) {
    if (min(s.start) - cursor >= 15) lines.push(`${fmt(cursor)}–${s.start}  ☕ 空档（逛展位 / 休息 / 换场）`)
    const who = (s.speakers || []).map(p => p[0]).join('、')
    lines.push(`${s.start}–${s.end}  ${s.title}${who ? ` — ${who}` : ''}  ［${trackLabel(s)}］${bad.has(s.id) ? ' ⚠️冲突' : ''}`)
    cursor = Math.max(cursor, min(s.end))
  }
  if (cursor < min('19:30')) lines.push(`${fmt(cursor)}–  自由活动`)
  lines.push('', importCode())
  return lines.join('\n')
}

const CODE_PREFIX = '导入码 VF26:'
const importCode = () => `${CODE_PREFIX}${state.picks.join(',')}`

/**
 * Extracts schedule ids from exported text. Prefers the trailing import code; falls back to
 * matching official URLs and Chinese titles, so hand-edited or truncated exports still mostly work.
 */
function parseImport(text) {
  const code = text.match(/VF26:([\w,-]+)/)
  if (code) return code[1].split(',').filter(id => byId[id] && pickable(byId[id]))
  return S.filter(s => pickable(s) && ((s.url && text.includes(OFFICIAL + s.url)) || text.includes(s.title))).map(s => s.id)
}

function applyImport(mode) {
  const ids = parseImport(document.getElementById('impText').value)
  if (!ids.length) return toast('没有识别到场次')
  state.picks = mode === 'replace' ? ids : [...new Set([...state.picks, ...ids])]
  state.view = 'mine'
  save()
  render()
  document.getElementById('imp').close()
  toast(`已导入 ${ids.length} 场 ✓`)
}

let toastTimer
function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800)
}

/**
 * Copies text in a way that also works on iOS Safari over plain http / file:// where
 * navigator.clipboard is unavailable; falls back to a manual-copy dialog as last resort.
 */
async function copy(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text)
      return toast('已复制到剪贴板 ✓')
    }
  } catch {}
  const ta = document.createElement('textarea')
  ta.value = text
  ta.setAttribute('readonly', '')
  ta.contentEditable = 'true'
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px'
  document.body.appendChild(ta)
  const range = document.createRange()
  range.selectNodeContents(ta)
  const sel = getSelection()
  sel.removeAllRanges()
  sel.addRange(range)
  ta.setSelectionRange(0, text.length)
  let ok = false
  try { ok = document.execCommand('copy') } catch {}
  ta.remove()
  sel.removeAllRanges()
  if (ok) return toast('已复制到剪贴板 ✓')
  const dlg = document.getElementById('dlg')
  document.getElementById('dlgText').value = text
  document.getElementById('dlgShare').hidden = !navigator.share
  dlg.showModal()
}

document.getElementById('list').addEventListener('click', e => {
  if (e.target.closest('a')) return
  const card = e.target.closest('.card')
  if (!card) return
  const id = card.dataset.id
  if (e.target.closest('[data-act="pick"]')) {
    const i = state.picks.indexOf(id)
    i >= 0 ? state.picks.splice(i, 1) : state.picks.push(id)
    if (i < 0 && navigator.vibrate) navigator.vibrate(8)
    toast(i >= 0 ? '已取消标记' : '已加入我的日程 ⭐')
  } else if (e.target.closest('[data-act="more"]') && card.querySelector('.more')) {
    const i = state.open.indexOf(id)
    i >= 0 ? state.open.splice(i, 1) : state.open.push(id)
  } else return
  save()
  render()
})

  save()
  render()
  toast(state.layout === 'grid' ? '时间表视图（可左右滑动）' : '列表视图')
}
document.getElementById('copyList').onclick = () => copy(exportList())
document.getElementById('copyPlan').onclick = () => copy(exportPlan())
document.getElementById('dlgClose').onclick = () => document.getElementById('dlg').close()
document.getElementById('dlgShare').onclick = () => navigator.share({ text: document.getElementById('dlgText').value }).catch(() => {})
document.getElementById('nowBtn').onclick = () => {
  const now = nowJst()
  const slots = [...document.querySelectorAll('.slot')]
  const target = slots.filter(x => min(x.dataset.start) <= now).pop() || slots[0]
  const off = document.getElementById('top').offsetHeight
  scrollTo({ top: target.getBoundingClientRect().top + scrollY - off - 4, behavior: 'smooth' })
}

function renderChips() {
  const chips = [['all', '全部会场', 'var(--accent)'], ...Object.entries(TRACKS).map(([k, t]) => [k, t.name + ' 会场', t.color])]
  const el = document.getElementById('chips')
  el.innerHTML = chips.map(([k, label, c]) => `<button class="chip" style="--c:${c}" data-k="${k}" aria-pressed="${state.track === k}">${k === 'all' ? '' : '<i></i>'}${esc(label)}</button>`).join('')
  el.onclick = e => {
    const b = e.target.closest('.chip')
    if (!b) return
    state.track = b.dataset.k
    save()
    renderChips()
    render()
  }
}

/** Keeps the sticky time headers right below the (variable-height) top bar. */
function syncHeadHeight() {
  document.documentElement.style.setProperty('--head-h', document.getElementById('top').offsetHeight + 'px')
}

/**
 * Hides the top and bottom bars while scrolling down and brings them back on any
 * upward scroll, near the top, or at the very bottom (so the action bar is reachable).
 */
function setupAutoHide() {
  let lastY = scrollY
  let ticking = false
  const update = () => {
    ticking = false
    const y = scrollY
    const dy = y - lastY
    const atBottom = innerHeight + y >= document.documentElement.scrollHeight - 40
    if (y < 60 || atBottom || dy < -8) document.body.classList.remove('chrome-off')
    else if (dy > 8) document.body.classList.add('chrome-off')
    if (Math.abs(dy) > 8) lastY = y
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(update) } }, { passive: true })
}

renderChips()
render()
new ResizeObserver(fitGrid).observe(document.getElementById('list'))
syncHeadHeight()
setupAutoHide()
desktop.addEventListener('change', () => { render(); syncHeadHeight() })
addEventListener('resize', syncHeadHeight)
new ResizeObserver(syncHeadHeight).observe(document.getElementById('top'))
setInterval(render, 60e3)
</script>
